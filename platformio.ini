[platformio]
default_envs = arduino_nano_esp32_idf5

; ==========================================================
; Shared Global Settings (Applies to all boards)
; ==========================================================
[env]
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
board_build.embed_files =
    data/cert/x509_crt_bundle.bin
    web/assets/meshgate-logo.svg
    web/generated/index_html.gz
build_flags =
    -D CORE_DEBUG_LEVEL=3                   ; Set Arduino global max level to Info to silence WiFi noise.
    -D CONFIG_NIMBLE_CPP_LOG_LEVEL=2        ; Set NimBLE log level to Warn or above.
extra_scripts =
    pre:generate_web_ui.py                  ; Pre-compresses the embedded control page for slow VPN/DERP paths.
    pre:generate_protos.py                  ; For compiling meshtastic protocol buffers.
    pre:inject_ota_token.py                 ; Injects the local, untracked OTA bootstrap token when present.
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.1
    mathieucarbou/ESPAsyncWebServer @ ^3.3.23
    nanopb/Nanopb @ ^0.4.7
    felipedadison/WireGuard-ESP32 @ ^0.3.2
lib_ignore =
    MicroLink

; ==========================================================
; Arduino Nano ESP32 production target (ESP32-S3 / ESP-IDF 5)
; Arduino Core 3.3.9 on ESP-IDF 5.5.4 with NimBLE 2.5.2 and MicroLink.
; This is the project's only supported and built firmware target.
; ==========================================================
[env:arduino_nano_esp32_idf5]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.39
board = arduino_nano_esp32
upload_protocol = esptool
board_build.partitions = default_16MB.csv
board_build.variants_dir = variants
lib_deps =
    h2zero/NimBLE-Arduino @ 2.5.2
    mathieucarbou/ESPAsyncWebServer @ ^3.3.23
    nanopb/Nanopb @ ^0.4.7
build_flags =
    ${env.build_flags}
    -D HARDWARE_BOARD_NAME=\"arduino_nano_esp32\"
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D BOOT_BUTTON_PIN=-1
    -D STATUS_LED_PIN=-1
    -D LED_ACTIVE_LOW=false
    -D ESP_IDF5_MIGRATION_BUILD=1
    ; Four tailnet peers are sufficient for this bridge deployment and keep
    ; internal SRAM available for DERP/WireGuard and an active TCP client.
    -D CONFIG_ML_MAX_PEERS=4
    -D CONFIG_ML_H2_BUFFER_SIZE_KB=512
    -D CONFIG_ML_JSON_BUFFER_SIZE_KB=512
    -D CONFIG_ML_PRIORITY_PEER_IP=\"\"
    -D CONFIG_ML_DEVICE_NAME=\"meshgate\"
    ; AsyncTCP defaults to a 16 KiB internal-RAM stack. 4 KiB is supported and
    ; sufficient for this bounded WebUI/TCP workload. Large TLS data buffers
    ; use the PSRAM-aware allocator installed by mqtt_net_init().
    -D CONFIG_ASYNC_TCP_STACK_SIZE=4096
    ; Keep MicroLink's DERP and coordination stacks in PSRAM. Application and
    ; cache-sensitive network/WireGuard task stacks remain in internal RAM.
    -D MICROLINK_DERP_STACK_PSRAM=1
    -D MICROLINK_COORD_STACK_PSRAM=1
    ; Use smaller, still burst-safe BLE/TCP queues for the combined services.
    -D BRIDGE_QUEUE_SIZE=4
    -D MQTT_QUEUE_SIZE=2
lib_ignore =
    WireGuard-ESP32
