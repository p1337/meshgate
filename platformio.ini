[platformio]
default_envs = seeed_xiao_esp32s3, esp32dev, esp32-s3-devkitc-1, arduino_nano_esp32

; ==========================================================
; Shared Global Settings (Applies to all boards)
; ==========================================================
[env]
platform = espressif32 @ ^6.9.0
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
board_build.embed_files = data/cert/x509_crt_bundle.bin
build_flags =
    -D CORE_DEBUG_LEVEL=3                   ; Set Arduino global max level to Info to silence WiFi noise.
    -D CONFIG_NIMBLE_CPP_LOG_LEVEL=2        ; Set NimBLE log level to Warn or above.
extra_scripts =
    pre:generate_protos.py                  ; For compiling meshtastic protocol buffers.
    pre:inject_ota_token.py                 ; Injects the local, untracked OTA bootstrap token when present.
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.1
    mathieucarbou/ESPAsyncWebServer @ ^3.3.23
    nanopb/Nanopb @ ^0.4.7
    felipedadison/WireGuard-ESP32 @ ^0.3.2
lib_ignore =
    MicroLink

; ==========================================================
; 1. Seeed XIAO ESP32-S3 (The Primary Dev Board)
; ==========================================================
[env:seeed_xiao_esp32s3]
board = seeed_xiao_esp32s3
build_flags =
    ${env.build_flags}
    -D HARDWARE_BOARD_NAME=\"seeed_xiao_esp32s3\"
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D BOOT_BUTTON_PIN=0
    -D STATUS_LED_PIN=21
    -D LED_ACTIVE_LOW=true

; ==========================================================
; 2. Generic ESP32 (Classic WROOM-32, NodeMCU-32S, etc)
; Extremely common. Hardware UART.
; ==========================================================
[env:esp32dev]
board = esp32dev
build_flags =
    ${env.build_flags}
    -D HARDWARE_BOARD_NAME=\"esp32dev\"
    -D BOOT_BUTTON_PIN=0
    -D STATUS_LED_PIN=2
    -D LED_ACTIVE_LOW=false

; ==========================================================
; 3. Generic ESP32-S3 DevKitC
; Standard S3 dev board. Dual USB ports.
; ==========================================================
[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D HARDWARE_BOARD_NAME=\"esp32-s3-devkitc-1\"
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D BOOT_BUTTON_PIN=0
    ; Many generic S3 devkits don't have a standard single-color user LED.
    ; Pin 2 is commonly used if one exists.
    -D STATUS_LED_PIN=2
    -D LED_ACTIVE_LOW=false

; ==========================================================
; 4. Arduino Nano ESP32 (ESP32-S3)
; The Nano has no separate BOOT button or simple status LED that is safe to
; toggle. B1/GPIO0 remains reserved for entering ROM download mode.
; ==========================================================
[env:arduino_nano_esp32]
board = arduino_nano_esp32
upload_protocol = esptool
board_build.partitions = default_16MB.csv
board_build.variants_dir = variants
build_flags =
    ${env.build_flags}
    -D HARDWARE_BOARD_NAME=\"arduino_nano_esp32\"
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D BOOT_BUTTON_PIN=-1
    -D STATUS_LED_PIN=-1
    -D LED_ACTIVE_LOW=false

; ==========================================================
; 5. Arduino Nano ESP32 migration target
; Arduino Core 3.1.3 on ESP-IDF 5.3.2.  This environment is kept separate
; until the complete BLE/MQTT/WireGuard/OTA firmware and MicroLink compile
; together; the proven IDF 4 build above remains available for recovery.
; ==========================================================
[env:arduino_nano_esp32_idf5]
extends = env:arduino_nano_esp32
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.39
lib_deps =
    h2zero/NimBLE-Arduino @ 2.5.2
    mathieucarbou/ESPAsyncWebServer @ ^3.3.23
    nanopb/Nanopb @ ^0.4.7
build_flags =
    ${env:arduino_nano_esp32.build_flags}
    -D ESP_IDF5_MIGRATION_BUILD=1
    ; Four tailnet peers are sufficient for this bridge deployment and keep
    ; internal SRAM available for DERP/WireGuard and an active TCP client.
    -D CONFIG_ML_MAX_PEERS=4
    -D CONFIG_ML_H2_BUFFER_SIZE_KB=512
    -D CONFIG_ML_JSON_BUFFER_SIZE_KB=512
    -D CONFIG_ML_PRIORITY_PEER_IP=\"\"
    -D CONFIG_ML_DEVICE_NAME=\"meshgate\"
    ; Keep the DERP and coordination stacks in PSRAM.
    ; mbedTLS is built for internal allocation and otherwise cannot obtain a
    ; large enough contiguous block for the DERP TLS context.
    -D MICROLINK_DERP_STACK_PSRAM=1
    -D MICROLINK_COORD_STACK_PSRAM=1
    ; The remaining MicroLink stacks and TLS allocations still need internal
    ; RAM, so use smaller, still burst-safe BLE/TCP queues.
    -D BRIDGE_QUEUE_SIZE=4
    -D MQTT_QUEUE_SIZE=2
lib_ignore =
    WireGuard-ESP32
