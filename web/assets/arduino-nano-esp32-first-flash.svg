<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="820" height="603" viewBox="0 0 820 603" role="img"
     aria-labelledby="title description">
  <title id="title">Arduino Nano ESP32 first-flash bridge</title>
  <desc id="description">Arduino Nano ESP32 with a red dashed temporary bridge between the GND and B1 pads.</desc>

  <defs>
    <pattern id="white-hatch" width="6" height="6" patternUnits="userSpaceOnUse"
             patternTransform="rotate(45)">
      <rect width="6" height="6" fill="rgba(255,255,255,0.15)"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#ffffff" stroke-width="2"/>
    </pattern>
    <filter id="label-shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <image href="arduino-nano-esp32.png" xlink:href="arduino-nano-esp32.png"
         x="0" y="0" width="820" height="603"/>

  <!-- Official Nano ESP32 edge order at this end: VIN, GND, B1, VBUS, A7. -->
  <g aria-label="Temporary B1 to GND bridge">
    <ellipse cx="702" cy="164" rx="13" ry="9" transform="rotate(-43 702 164)"
             fill="url(#white-hatch)" stroke="#ffffff" stroke-width="2"/>
    <ellipse cx="675" cy="190" rx="13" ry="9" transform="rotate(-43 675 190)"
             fill="url(#white-hatch)" stroke="#ffffff" stroke-width="2"/>

    <path d="M 707 159
             C 755 155, 799 190, 802 235
             C 805 280, 775 309, 738 300
             C 701 291, 702 238, 677 196"
          fill="none" stroke="#ef1b19" stroke-width="7" stroke-linecap="round"
          stroke-linejoin="round" stroke-dasharray="13 11"/>

    <circle cx="702" cy="164" r="5" fill="#ef1b19" stroke="#ffffff" stroke-width="2"/>
    <circle cx="675" cy="190" r="5" fill="#ef1b19" stroke="#ffffff" stroke-width="2"/>

    <g filter="url(#label-shadow)" font-family="'JetBrains Mono', Consolas, monospace"
       font-size="18" font-weight="700">
      <path d="M 729 148 L 708 161" fill="none" stroke="#111820" stroke-width="3"/>
      <rect x="729" y="125" width="66" height="36" rx="7" fill="#ffffff" stroke="#111820" stroke-width="3"/>
      <text x="762" y="149" text-anchor="middle" fill="#111820">GND</text>

      <path d="M 708 211 L 680 194" fill="none" stroke="#111820" stroke-width="3"/>
      <rect x="708" y="197" width="55" height="36" rx="7" fill="#ffffff" stroke="#111820" stroke-width="3"/>
      <text x="735.5" y="221" text-anchor="middle" fill="#111820">B1</text>
    </g>
  </g>
</svg>
