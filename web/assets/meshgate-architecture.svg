<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">MeshGate system architecture</title>
  <desc id="desc">A solar-powered outdoor RAK WisBlock Meshtastic node connects over Bluetooth Low Energy to an indoor mains-powered ESP32-S3 MeshGate. MeshGate uses Wi-Fi for local Meshtastic clients, Tailscale or WireGuard VPN, MQTT and a persistent message mailbox.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#172633" stroke-width="1"/>
    </pattern>
    <pattern id="concrete-hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#111b24"/>
      <path d="M0 0V14M7 0V14M14 0V14" stroke="#667887" stroke-width="1.5"/>
    </pattern>
    <linearGradient id="outdoor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b1a"/>
      <stop offset="1" stop-color="#0a141c"/>
    </linearGradient>
    <linearGradient id="indoor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1720"/>
      <stop offset="1" stop-color="#101522"/>
    </linearGradient>
    <linearGradient id="green-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#03f082" stop-opacity=".08"/>
      <stop offset=".5" stop-color="#03f082" stop-opacity=".7"/>
      <stop offset="1" stop-color="#03f082" stop-opacity=".08"/>
    </linearGradient>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1l8 4-8 4" fill="none" stroke="#03f082" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1l8 4-8 4" fill="none" stroke="#8ea4b5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .sans{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,Monaco,monospace}
      .label{fill:#8ea4b5;font-size:18px;letter-spacing:2px}.title{fill:#f3f7fa;font-size:26px;font-weight:600}.body{fill:#b9c8d3;font-size:18px}.small{fill:#8ea4b5;font-size:15px}.chip{fill:#0b141c;stroke:#304352;stroke-width:1.5}.card{fill:#0b141c;stroke:#304352;stroke-width:1.5}.service{fill:#0b141c;stroke:#304352;stroke-width:1.5}.green{fill:#03f082}.orange{fill:#fa5300}.green-stroke{stroke:#03f082}.muted-stroke{stroke:#8ea4b5}.line{fill:none;stroke-linecap:round;stroke-linejoin:round}.ns{vector-effect:non-scaling-stroke}
    </style>
  </defs>

  <rect width="1600" height="900" fill="#071019"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity=".6"/>

  <!-- MeshGate logo -->
  <g transform="translate(458 28) scale(.76)">
    <path fill="#fa5300" transform="translate(142 80)" d="M0 0 4 2l8 9 5 5 46 46 15 1 2-5 7-6 8-3h9l8 3 5 4 5 8 1 3v12l-4 8-8 7-5 2H93l-8-4-5-5-2-5-16 1-61 61-4-1-11-12-48-48-16-1-2 5-8 7-5 2h-13l-8-4-7-8-2-5V66l3-6 5-6 10-5h11l10 5 6 7v2l16-1Zm0 26-12 12-5 5-9 10-20 20 6 7 38 38 4-1 14-15 7-8 5-5 17-17-6-7-12-12-7-8L5 30l-3-4Z"/>
    <path fill="#03f082" transform="translate(142 80)" d="m0 0 2 1-1 26-11 11-5 5-10 10-20 20 6 7 37 37 2 1v26l-4-2-9-10-49-49-16-1-2 5-8 7-5 2h-13l-8-4-7-8-2-5V66l3-6 5-6 10-5h11l10 5 6 7v2l16-1Z"/>
    <path fill="#02dd6d" transform="translate(287 114)" d="M0 0h21l15 24 6 9 2-2 3 1 4-4 10-16 8-12h20l1 1v75H68l-1-36-13 20H36l-7-10-7-11-1 37-20 1-2 1Zm46 34Zm-3 1Zm2 1Zm-1 1Z"/>
    <path fill="#02d969" d="M382 114h62v18h-41v11h33v18h-33v11h41v18h-62Z"/>
    <path fill="#fa5001" transform="translate(610 114)" d="M0 0h55v18l-7 1H10l-3 4v31l3 3h23l2-2 1-8H20V29h35l1 1v33L43 76H0l-11-11-3-2-1-6V34l1-21 8-7Z"/>
    <path fill="#04d363" transform="translate(518 114)" d="M0 0h21v29l29-1-1-28h23v75l-1 1H50V61l1-14H21v29l-22 1Z"/>
    <path fill="#fa4f00" transform="translate(809 114)" d="M0 0h62v18H21v11h33l-1 18H21v11h41v18H1l-1 2-2-1v-5l1 0Z"/>
    <path fill="#02d768" transform="translate(459 114)" d="M0 0h51v18l-41 1-2 2v5l2 2 31 1 13 13v21l-10 9-4 4h-51V58l41-1 2-2v-6l-2-1-31-1-12-12-2-22 5-3Z"/>
    <path fill="#fb4f00" transform="translate(696 114)" d="M0 0h24l6 12 16 39 9 22v3H33l-5-10v-2H-4l-3 10-1 2h-22l1-6 18-44Zm11 25L3 46h18l-6-16-2-5Z"/>
    <path fill="#fb5000" transform="translate(738 114)" d="M0 0h67v18H44v58H23V18H0Z"/>
  </g>
  <text x="800" y="222" text-anchor="middle" class="sans label">REMOTE ACCESS FOR BLUETOOTH-ONLY MESHTASTIC RADIOS</text>

  <!-- Main zones -->
  <rect x="54" y="278" width="520" height="492" rx="24" fill="url(#outdoor)" stroke="#244136" stroke-width="2"/>
  <rect x="682" y="278" width="864" height="492" rx="24" fill="url(#indoor)" stroke="#27384b" stroke-width="2"/>
  <text x="86" y="323" class="mono label green">OUTDOOR · SOLAR</text>
  <text x="714" y="323" class="mono label green">INDOOR · MAINS POWER + WI-FI</text>

  <!-- Outdoor: solar panel -->
  <g transform="translate(92 377)">
    <circle cx="46" cy="-22" r="20" fill="none" stroke="#ffcc4a" stroke-width="4"/>
    <g stroke="#ffcc4a" stroke-width="3" stroke-linecap="round">
      <path d="M46-54v-14M46 10v14M14-22H0M92-22h14M23-45 13-55M69 1l10 10M69-45l10-10M23 1 13 11"/>
    </g>
    <path d="M4 34h126l-16 88H-12Z" fill="#0d2636" stroke="#4fa9d8" stroke-width="3"/>
    <path d="M8 56h118M4 80h118M0 104h118M26 34l-13 88M58 34l-10 88M90 34l-7 88" fill="none" stroke="#4fa9d8" stroke-width="2" opacity=".8"/>
    <path d="M42 122v22M80 122v22M25 144h75" fill="none" stroke="#8ea4b5" stroke-width="4" stroke-linecap="round"/>
    <text x="58" y="179" text-anchor="middle" class="sans body">Solar panel</text>
  </g>

  <!-- Battery -->
  <g transform="translate(245 430)">
    <rect x="0" y="0" width="76" height="112" rx="12" class="card"/>
    <rect x="24" y="-10" width="28" height="12" rx="3" fill="#8ea4b5"/>
    <rect x="12" y="18" width="52" height="74" rx="6" fill="#102a24" stroke="#03f082" stroke-width="2"/>
    <path d="M40 30 27 58h13l-5 23 18-32H41Z" fill="#03f082"/>
    <text x="38" y="144" text-anchor="middle" class="sans body">Battery</text>
    <text x="38" y="166" text-anchor="middle" class="sans small">long autonomy</text>
  </g>
  <path d="M222 486H236" class="line green-stroke" stroke-width="3" marker-end="url(#arrow-green)"/>

  <!-- WisBlock node -->
  <g transform="translate(346 369)">
    <rect x="0" y="0" width="190" height="238" rx="18" class="card"/>
    <path d="M145 24c24 0 34-16 34-16M152 32c28 0 38-20 38-20" fill="none" stroke="#8ea4b5" stroke-width="3" stroke-linecap="round"/>
    <rect x="32" y="42" width="126" height="104" rx="10" fill="#0c2b28" stroke="#03f082" stroke-width="2"/>
    <rect x="63" y="67" width="66" height="54" rx="7" fill="#071019" stroke="#657c8c" stroke-width="2"/>
    <path d="M48 52v84M142 52v84M32 58H20M32 78H20M32 98H20M32 118H20M158 58h12M158 78h12M158 98h12M158 118h12" stroke="#657c8c" stroke-width="3" stroke-linecap="round"/>
    <circle cx="48" cy="160" r="5" fill="#03f082"/>
    <text x="95" y="185" text-anchor="middle" class="sans title">RAK WisBlock</text>
    <text x="95" y="210" text-anchor="middle" class="sans body">Meshtastic node</text>
    <text x="95" y="232" text-anchor="middle" class="mono small">LoRa + BLE</text>
  </g>
  <path d="M321 486H338" class="line green-stroke" stroke-width="3" marker-end="url(#arrow-green)"/>

  <!-- Official Meshtastic logo: https://github.com/meshtastic/design -->
  <a href="https://meshtastic.org/" target="_blank" aria-label="Meshtastic website">
    <svg x="76" y="622" width="124" height="68" viewBox="0 0 100 55" role="img" aria-label="Meshtastic logo">
      <g transform="matrix(0.802386,0,0,0.460028,-421.748,-122.127)">
        <g transform="matrix(0.579082,0,0,1.01004,460.975,-39.6867)">
          <path d="M250.908,330.267L193.126,415.005L180.938,406.694L244.802,313.037C246.174,311.024 248.453,309.819 250.889,309.816C253.326,309.814 255.606,311.015 256.982,313.026L320.994,406.536L308.821,414.869L250.908,330.267Z" fill="#03f082"/>
        </g>
        <g transform="matrix(0.582378,0,0,1.01579,485.019,-211.182)">
          <path d="M87.642,581.398L154.757,482.977L142.638,474.713L75.523,573.134L87.642,581.398Z" fill="#03f082"/>
        </g>
      </g>
    </svg>
  </a>
  <text x="138" y="706" text-anchor="middle" class="mono body green">MESHTASTIC®</text>
  <text x="365" y="690" text-anchor="middle" class="sans body green">Ultra-low-power operation</text>
  <text x="365" y="716" text-anchor="middle" class="sans small">maximum solar autonomy outdoors</text>

  <!-- Concrete wall with ANSI-style section hatching and BLE link -->
  <g>
    <rect x="594" y="338" width="56" height="376" rx="3" fill="url(#concrete-hatch)" stroke="#8ea4b5" stroke-width="2"/>
    <path d="M594 390h56M594 468h56M594 546h56M594 624h56" stroke="#344754" stroke-width="2"/>
    <path d="M548 469c28-28 57-28 85 0M562 483c19-19 38-19 57 0M577 498c9-9 18-9 27 0" fill="none" stroke="#03f082" stroke-width="4" stroke-linecap="round"/>
    <circle cx="590" cy="510" r="6" fill="#03f082"/>
    <path d="M547 530h89" class="line green-stroke" stroke-width="3" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)"/>
    <rect x="547" y="555" width="89" height="30" rx="15" fill="#102a24" stroke="#03f082"/>
    <text x="591" y="576" text-anchor="middle" class="mono small green">BLE</text>
    <text x="622" y="744" text-anchor="middle" class="mono small" fill="#8ea4b5">CONCRETE WALL</text>
  </g>

  <!-- Indoor ESP32-S3 gateway -->
  <g transform="translate(722 377)">
    <rect x="0" y="0" width="272" height="274" rx="20" class="card" stroke="#03f082" stroke-width="2"/>
    <rect x="54" y="34" width="164" height="122" rx="12" fill="#0c2b28" stroke="#03f082" stroke-width="2"/>
    <rect x="93" y="67" width="86" height="58" rx="8" fill="#071019" stroke="#657c8c" stroke-width="2"/>
    <text x="136" y="101" text-anchor="middle" class="mono body green">ESP32-S3</text>
    <path d="M54 50H34M54 74H34M54 98H34M54 122H34M54 146H34M218 50h20M218 74h20M218 98h20M218 122h20M218 146h20" stroke="#657c8c" stroke-width="3" stroke-linecap="round"/>
    <path d="M202 24c20 0 31-12 31-12M210 35c25 0 38-16 38-16" fill="none" stroke="#8ea4b5" stroke-width="3" stroke-linecap="round"/>
    <svg x="42" y="184" width="188" height="54" viewBox="0 70 900 150" role="img" aria-label="MeshGate">
      <g>
        <path fill="#fa5300" transform="translate(142 80)" d="M0 0 4 2l8 9 5 5 46 46 15 1 2-5 7-6 8-3h9l8 3 5 4 5 8 1 3v12l-4 8-8 7-5 2H93l-8-4-5-5-2-5-16 1-61 61-4-1-11-12-48-48-16-1-2 5-8 7-5 2h-13l-8-4-7-8-2-5V66l3-6 5-6 10-5h11l10 5 6 7v2l16-1Zm0 26-12 12-5 5-9 10-20 20 6 7 38 38 4-1 14-15 7-8 5-5 17-17-6-7-12-12-7-8L5 30l-3-4Z"/>
        <path fill="#03f082" transform="translate(142 80)" d="m0 0 2 1-1 26-11 11-5 5-10 10-20 20 6 7 37 37 2 1v26l-4-2-9-10-49-49-16-1-2 5-8 7-5 2h-13l-8-4-7-8-2-5V66l3-6 5-6 10-5h11l10 5 6 7v2l16-1Z"/>
        <path fill="#02dd6d" transform="translate(287 114)" d="M0 0h21l15 24 6 9 2-2 3 1 4-4 10-16 8-12h20l1 1v75H68l-1-36-13 20H36l-7-10-7-11-1 37-20 1-2 1Zm46 34Zm-3 1Zm2 1Zm-1 1Z"/>
        <path fill="#02d969" d="M382 114h62v18h-41v11h33v18h-33v11h41v18h-62Z"/>
        <path fill="#fa5001" transform="translate(610 114)" d="M0 0h55v18l-7 1H10l-3 4v31l3 3h23l2-2 1-8H20V29h35l1 1v33L43 76H0l-11-11-3-2-1-6V34l1-21 8-7Z"/>
        <path fill="#04d363" transform="translate(518 114)" d="M0 0h21v29l29-1-1-28h23v75l-1 1H50V61l1-14H21v29l-22 1Z"/>
        <path fill="#fa4f00" transform="translate(809 114)" d="M0 0h62v18H21v11h33l-1 18H21v11h41v18H1l-1 2-2-1v-5l1 0Z"/>
        <path fill="#02d768" transform="translate(459 114)" d="M0 0h51v18l-41 1-2 2v5l2 2 31 1 13 13v21l-10 9-4 4h-51V58l41-1 2-2v-6l-2-1-31-1-12-12-2-22 5-3Z"/>
        <path fill="#fb4f00" transform="translate(696 114)" d="M0 0h24l6 12 16 39 9 22v3H33l-5-10v-2H-4l-3 10-1 2h-22l1-6 18-44Zm11 25L3 46h18l-6-16-2-5Z"/>
        <path fill="#fb5000" transform="translate(738 114)" d="M0 0h67v18H44v58H23V18H0Z"/>
      </g>
    </svg>
    <text x="136" y="263" text-anchor="middle" class="sans body">BLE ↔ TCP / HTTP gateway</text>
  </g>

  <!-- Wi-Fi hub -->
  <g transform="translate(1032 514)">
    <circle cx="0" cy="0" r="54" fill="#0c2b28" stroke="#03f082" stroke-width="2"/>
    <path d="M-28-8c18-18 38-18 56 0M-18 3c12-12 24-12 36 0M-8 14c5-5 11-5 16 0" fill="none" stroke="#03f082" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="24" r="5" fill="#03f082"/>
    <text x="0" y="82" text-anchor="middle" class="mono body green">WI-FI</text>
  </g>
  <path d="M994 512h22" class="line green-stroke" stroke-width="3" marker-end="url(#arrow-green)"/>

  <!-- Service branches -->
  <path d="M1080 482h38V384h24M1086 506h32v-18h24M1086 530h32v62h24M1080 546h24v150h38" class="line muted-stroke" stroke-width="2.5" marker-end="url(#arrow-muted)"/>

  <g transform="translate(1143 340)">
    <rect width="356" height="88" rx="14" class="service"/>
    <circle cx="34" cy="44" r="18" fill="#102a24" stroke="#03f082"/>
    <path d="M23 44h22M34 33v22" stroke="#03f082" stroke-width="2.5" stroke-linecap="round"/>
    <text x="68" y="34" class="mono small green">LOCAL CLIENTS</text>
    <text x="68" y="60" class="sans body">Meshtastic app · TCP 4403 · HTTP</text>
  </g>

  <g transform="translate(1143 444)">
    <rect width="356" height="88" rx="14" class="service"/>
    <path d="M22 49c-12-3-12-21 1-23 4-15 26-15 31-2 14-1 19 19 5 25Z" fill="#101d2a" stroke="#4fa9d8" stroke-width="2"/>
    <path d="M33 49v-8a8 8 0 0 1 16 0v8" fill="none" stroke="#4fa9d8" stroke-width="2"/>
    <text x="76" y="34" class="mono small" fill="#4fa9d8">PRIVATE REMOTE ACCESS</text>
    <text x="76" y="60" class="sans body">Tailscale / DERP · WireGuard VPN</text>
  </g>

  <g transform="translate(1143 548)">
    <rect width="356" height="88" rx="14" class="service"/>
    <path d="M21 31h38v28H21zM28 38h24M28 45h24M28 52h14" fill="none" stroke="#fa5300" stroke-width="2"/>
    <text x="76" y="34" class="mono small orange">MQTT BROKER</text>
    <text x="76" y="60" class="sans body">MeshRadar or private MQTT service</text>
  </g>

  <g transform="translate(1143 652)">
    <rect width="356" height="88" rx="14" class="service"/>
    <path d="M22 31h36v28H22zM28 25h24v8M28 41h24M28 48h18" fill="none" stroke="#c78cff" stroke-width="2"/>
    <text x="76" y="34" class="mono small" fill="#c78cff">MESSAGE SERVER</text>
    <text x="76" y="60" class="sans body">Persistent mailbox · replay · GET API</text>
  </g>

  <!-- Bottom statement -->
  <rect x="54" y="807" width="1492" height="2" fill="url(#green-glow)"/>
  <text x="800" y="852" text-anchor="middle" class="sans title">Ultra-low-power radio outside. Reliable powered gateway inside. Secure access from anywhere.</text>
  <text x="800" y="881" text-anchor="middle" class="mono small" fill="#6f8798">NO RASPBERRY PI · NO PUBLIC IP · NO PORT FORWARDING</text>
</svg>
