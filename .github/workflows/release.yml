name: Release Firmware

on:
  push:
    tags:
      - 'v*.*.*' # Trigger on version tags e.g. v1.0.0

permissions:
  contents: write

jobs:
  build_and_release:
    name: Build & Release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Build Dependencies & Toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini', 'generate_protos.py', 'proto/meshtastic/meshtastic/*.proto') }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
            ${{ runner.os }}-pio-

      - name: Install PlatformIO Core & Dependencies
        run: |
          pip install -U platformio protobuf grpcio-tools
          pio pkg install -e arduino_nano_esp32_idf5 --no-save
          "$HOME/.platformio/penv/bin/python" -m pip install -U protobuf grpcio-tools

      - name: Inject Version into Firmware
        run: |
          VERSION="${GITHUB_REF_NAME}"
          SOURCE_VERSION=$(sed -n 's/^#define FIRMWARE_VERSION "\([^"]*\)"/\1/p' include/build_options.h)
          if [ "$SOURCE_VERSION" != "$VERSION" ]; then
            echo "FIRMWARE_VERSION ($SOURCE_VERSION) must match release tag ($VERSION)."
            exit 1
          fi
          echo "Injecting version: $VERSION"
          # Find and replace the FIRMWARE_VERSION string inside build_options.h
          sed -i "s/#define FIRMWARE_VERSION .*/#define FIRMWARE_VERSION \"$VERSION\"/g" include/build_options.h

      - name: Build production ESP32-S3 firmware
        run: pio run -e arduino_nano_esp32_idf5

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release_assets
          BOOT_APP=~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin
          board="arduino_nano_esp32_idf5"
          dir=".pio/build/${board}"

          test -f "$BOOT_APP"
          test -f "$dir/firmware.bin"
          test -f "$dir/firmware.factory.bin"

          package="temp_zip/${board}"
          mkdir -p "$package"
          cp "$dir/firmware.bin" "$package/firmware.bin"
          cp "$dir/bootloader.bin" "$package/bootloader.bin"
          cp "$dir/partitions.bin" "$package/partitions.bin"
          cp "$BOOT_APP" "$package/boot_app0.bin"
          cp "$dir/firmware.factory.bin" "$package/firmware.factory.bin"

          cp "$dir/firmware.bin" "release_assets/meshgate-${board}-${GITHUB_REF_NAME}-ota.bin"
          cp "$dir/firmware.factory.bin" "release_assets/meshgate-${board}-${GITHUB_REF_NAME}-factory.bin"

          (
            cd "$package"
            zip -9 -r "../../release_assets/firmware-${board}-${GITHUB_REF_NAME}.zip" .
          )

          test "$(find release_assets -name 'firmware-*.zip' | wc -l)" -eq 1
          (cd release_assets && sha256sum * > SHA256SUMS.txt)

      - name: Prepare technical release notes
        shell: python
        run: |
          import os
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = f"## [{version}]"
          start = changelog.find(heading)
          if start < 0:
              raise SystemExit(f"CHANGELOG.md has no entry for {version}")
          end = changelog.find("\n## [", start + len(heading))
          section = changelog[start:end if end >= 0 else len(changelog)].strip()
          if not section:
              raise SystemExit(f"CHANGELOG.md entry for {version} is empty")

          instructions = """

          ## Install or update

          - Existing MeshGate: open its control page and select **Check & Install Latest Release**.
          - USB installation or recovery: https://p1337.github.io/meshgate/
          - Full instructions: https://github.com/p1337/meshgate#install
          - Verify downloaded assets with `SHA256SUMS.txt`.
          """
          logo = f"![MeshGate](https://raw.githubusercontent.com/p1337/meshgate/{version}/web/assets/meshgate-logo.png)\n\n"
          Path("release_body.md").write_text(logo + section + instructions, encoding="utf-8")

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MeshGate ${{ github.ref_name }}
          body_path: release_body.md
          draft: false
          prerelease: false
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: release_assets/*
