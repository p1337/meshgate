name: Build Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: PlatformIO Build Check
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Build Dependencies & Toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini', 'generate_protos.py', 'proto/meshtastic/meshtastic/*.proto') }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
            ${{ runner.os }}-pio-

      - name: Install PlatformIO Core & Dependencies
        run: pip install -U platformio protobuf grpcio-tools

      - name: Build recovery firmware profiles
        run: >-
          pio run
          -e seeed_xiao_esp32s3
          -e esp32dev
          -e esp32-s3-devkitc-1
          -e arduino_nano_esp32

      - name: Prepare production build environment
        run: |
          pio pkg install -e arduino_nano_esp32_idf5 --no-save
          "$HOME/.platformio/penv/bin/python" -m pip install -U protobuf grpcio-tools intelhex

      - name: Build production firmware profile
        run: pio run -e arduino_nano_esp32_idf5
