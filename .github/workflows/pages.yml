name: Deploy Web Flasher to GitHub Pages

on:
  release:
    types: [published]
  workflow_run:
    workflows: ["Release Firmware"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select stable and beta channels
        id: channels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > releases.json
          python tools/select_release_channels.py releases.json >> "$GITHUB_OUTPUT"

      - name: Setup Web Directory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STABLE_TAG: ${{ steps.channels.outputs.stable_tag }}
          CANDIDATE_TAG: ${{ steps.channels.outputs.candidate_tag }}
        run: |
          set -euo pipefail

          echo "Stable channel: $STABLE_TAG"
          echo "Beta candidate channel: $CANDIDATE_TAG"
          
          # The public Web Flasher intentionally remains stable-only.
          sed -i "s|id=\"version-display\">[^<]*|id=\"version-display\">Firmware Version: ${STABLE_TAG}|" web/index.html
          
          # Add a cache-buster to the manifest URLs to prevent browser caching issues
          # We use GITHUB_RUN_ID so even manual re-runs on the same tag bypass the cache
          sed -i "s/\.json/\.json?v=${GITHUB_RUN_ID}/g" web/index.html
          
          rm -rf web/firmware web/beta-firmware
          mkdir -p web/firmware
          gh release download "$STABLE_TAG" -D web/firmware --pattern "firmware-*.zip"
          
          cd web/firmware
          for zip in *.zip; do
            board=$(echo "$zip" | sed -E 's/firmware-(.+)-v[0-9].+/\1/')
            
            mkdir -p "$board"
            unzip "$zip" -d "$board"
            rm "$zip"
            
            if [[ "$board" == *"s3"* || "$board" == arduino_nano_esp32* ]]; then
              bootloader_offset="0"
              chip_family="ESP32-S3"
            else
              bootloader_offset="4096"
              chip_family="ESP32"
            fi
            
            if [ -f "$board/firmware.factory.bin" ]; then
              parts='[
                  { "path": "firmware/'"$board"'/firmware.factory.bin", "offset": 0 }
                ]'
            else
              parts='[
                  { "path": "firmware/'"$board"'/bootloader.bin", "offset": '"$bootloader_offset"' },
                  { "path": "firmware/'"$board"'/partitions.bin", "offset": 32768 },
                  { "path": "firmware/'"$board"'/boot_app0.bin", "offset": 57344 },
                  { "path": "firmware/'"$board"'/firmware.bin", "offset": 65536 }
                ]'
            fi

            cat <<EOF > "../manifest_${board}.json"
          {
            "name": "MeshGate factory install / recovery ($board)",
            "version": "$STABLE_TAG",
            "new_install_prompt_erase": true,
            "new_install_improv_wait_time": 30,
            "builds": [
              {
                "chipFamily": "$chip_family",
                "parts": $parts
              }
            ]
          }
          EOF

            if [ "$board" = "arduino_nano_esp32_idf5" ]; then
              test -f "$board/firmware.bin"
              ota_size=$(stat -c %s "$board/firmware.bin")
              ota_sha256=$(sha256sum "$board/firmware.bin" | awk '{print $1}')
              cat <<EOF > "../latest_ota.json"
          {
            "version": "$STABLE_TAG",
            "board": "arduino_nano_esp32_idf5",
            "url": "https://p1337.github.io/meshgate/firmware/arduino_nano_esp32_idf5/firmware.bin",
            "size": $ota_size,
            "sha256": "$ota_sha256"
          }
          EOF
            fi
          done
          cd ../../

          board="arduino_nano_esp32_idf5"
          mkdir -p "web/beta-firmware/${board}" candidate_asset
          gh release download "$CANDIDATE_TAG" -D candidate_asset \
            --pattern "meshgate-${board}-${CANDIDATE_TAG}-ota.bin"
          candidate_file="candidate_asset/meshgate-${board}-${CANDIDATE_TAG}-ota.bin"
          test -f "$candidate_file"
          cp "$candidate_file" "web/beta-firmware/${board}/firmware.bin"
          beta_size=$(stat -c %s "web/beta-firmware/${board}/firmware.bin")
          beta_sha256=$(sha256sum "web/beta-firmware/${board}/firmware.bin" | awk '{print $1}')
          cat <<EOF > "web/latest_beta_ota.json"
          {
            "version": "$CANDIDATE_TAG",
            "board": "$board",
            "url": "https://p1337.github.io/meshgate/beta-firmware/${board}/firmware.bin",
            "size": $beta_size,
            "sha256": "$beta_sha256"
          }
          EOF

          test -f "web/manifest_arduino_nano_esp32_idf5.json"
          test -f "web/latest_ota.json"
          test -f "web/latest_beta_ota.json"
          python -m json.tool web/latest_ota.json >/dev/null
          python -m json.tool web/latest_beta_ota.json >/dev/null

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
