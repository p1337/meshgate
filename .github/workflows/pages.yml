name: Deploy Web Flasher to GitHub Pages

on:
  release:
    types: [published]
  workflow_run:
    workflows: ["Release Firmware"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Web Directory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          LATEST_TAG=$(gh release view --json tagName --jq .tagName)
          if [ -z "$LATEST_TAG" ]; then
            echo "No releases found. Exiting."
            exit 1
          fi
          echo "Latest release is $LATEST_TAG. Downloading binaries..."
          
          # Inject the version string into the HTML
          sed -i "s|id=\"version-display\">[^<]*|id=\"version-display\">Firmware Version: ${LATEST_TAG}|" web/index.html
          
          # Add a cache-buster to the manifest URLs to prevent browser caching issues
          # We use GITHUB_RUN_ID so even manual re-runs on the same tag bypass the cache
          sed -i "s/\.json/\.json?v=${GITHUB_RUN_ID}/g" web/index.html
          
          gh release download "$LATEST_TAG" -D web/firmware --pattern "firmware-*.zip"
          
          cd web/firmware
          for zip in *.zip; do
            board=$(echo "$zip" | sed -E 's/firmware-(.+)-v[0-9].+/\1/')
            
            mkdir -p "$board"
            unzip "$zip" -d "$board"
            rm "$zip"
            
            if [[ "$board" == *"s3"* || "$board" == arduino_nano_esp32* ]]; then
              bootloader_offset="0"
              chip_family="ESP32-S3"
            else
              bootloader_offset="4096"
              chip_family="ESP32"
            fi
            
            if [ -f "$board/firmware.factory.bin" ]; then
              parts='[
                  { "path": "firmware/'"$board"'/firmware.factory.bin", "offset": 0 }
                ]'
            else
              parts='[
                  { "path": "firmware/'"$board"'/bootloader.bin", "offset": '"$bootloader_offset"' },
                  { "path": "firmware/'"$board"'/partitions.bin", "offset": 32768 },
                  { "path": "firmware/'"$board"'/boot_app0.bin", "offset": 57344 },
                  { "path": "firmware/'"$board"'/firmware.bin", "offset": 65536 }
                ]'
            fi

            cat <<EOF > "../manifest_${board}.json"
          {
            "name": "MeshGate factory install / recovery ($board)",
            "version": "$LATEST_TAG",
            "new_install_prompt_erase": true,
            "new_install_improv_wait_time": 30,
            "builds": [
              {
                "chipFamily": "$chip_family",
                "parts": $parts
              }
            ]
          }
          EOF

            if [ "$board" = "arduino_nano_esp32_idf5" ]; then
              test -f "$board/firmware.bin"
              ota_size=$(stat -c %s "$board/firmware.bin")
              ota_sha256=$(sha256sum "$board/firmware.bin" | awk '{print $1}')
              cat <<EOF > "../latest_ota.json"
          {
            "version": "$LATEST_TAG",
            "board": "arduino_nano_esp32_idf5",
            "url": "https://p1337.github.io/meshgate/firmware/arduino_nano_esp32_idf5/firmware.bin",
            "size": $ota_size,
            "sha256": "$ota_sha256"
          }
          EOF
            fi
          done
          cd ../../

          test -f "web/manifest_arduino_nano_esp32_idf5.json"
          test -f "web/latest_ota.json"
          python -m json.tool web/latest_ota.json >/dev/null

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
